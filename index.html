<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sta. Monica of Bustos MPC — Sales and Inventory (UI Prototype)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
<a class="visually-hidden-focusable" href="#view">Skip to content</a>
<div id="app"></div>
<div id="print-area" class="print-only" aria-hidden="true"></div>
<div id="panel" class="offcanvas offcanvas-end no-print" tabindex="-1" a Pearshesrude fromria-labelledby="panelTitle">
  <div class="offcanvas-header"><h2 class="h5 mb-0" id="panelTitle"></h2><button class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close details"></button></div>
  <div class="offcanvas-body"></div>
</div>
<div class="modal fade no-print" id="modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5"></h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body"></div><div class="modal-footer"></div>
  </div></div>
</div>
<div id="toasts" class="toast-container position-fixed top-0 end-0 p-3 no-print"></div>
<div id="sbTip" class="sb-tip no-print" role="tooltip" aria-hidden="true"></div>
<div class="notif-scrim no-print" id="notifScrim" data-act="noti fClose"></div>
<section class="notif-panel no-print" id="notifPanel" role="dialog" aria-labelledby="notifTitle" aria-hidden="true">
  <header class="notif-panel-head">
    <h2 class="notif-panel-title" id="notifTitle">Notifications</h2>
    <div class="notif-panel-head-actions">
      <button class="notif-icon-btn" type="button" data-act="notifReadAll" aria-label="Mark all notifications as read" title="Mark all as read"><i class="bi bi-check2-all"></i></button>
      <button class="notif-icon-btn" type="button" data-act="notifClose" aria-label="Close notifications"><i class="bi bi-x-lg"></i></button>
    </div>
  </header>
  <div class="notif-tabs" id="notifTabs" role="tablist" aria-label="Filter notifications"></div>
  <div class="notif-search">
    <i class="bi bi-search" aria-hidden="true"></i>
    <input type="search" class="notif-search-input" id="notifSearch" data-nf="1" placeholder="Search notifications" aria-label="Search notifications" autocomplete="off">
  </div>
  <div class="notif-panel-body" id="notifList"></div>
  <footer class="notif-panel-foot">
    <button class="notif-see-all" type="button" data-act="notifSeeAll"><span>See all alerts</span><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
  </footer>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/views-auth-dashboard.js"></script>
<script src="assets/js/views-inventory.js"></script>
<script src="assets/js/views-sales-reports.js"></script>
<script src="assets/js/views-admin.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
